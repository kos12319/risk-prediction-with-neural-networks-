extends: ../default

data:
  csv_path: data/raw/samples/thesis_data_sample_10k.csv

model:
  backend: h2o

automl:
  max_runtime_secs: 60
  max_models: null
  balance_classes: false
  seed: 42
  stopping_metric: AUC
  sort_metric: AUCPR
  include_algos: []
  exclude_algos: []
  nthreads: -1
  max_mem_size: null
  export_checkpoints_dir: null
  log_dir: null
  leaderboard_extra_columns: ALL
  leaderboard_make_test: true
  leaderboard_curve_top_n: 5
  explanation_plots:
    model_correlation: true
    varimp_heatmap: true

tracking:
  backend: wandb
  wandb:
    enabled: true
    mode: online
    run_name_template: "{dataset}|{split}|{pos}|h2o[{leader_algo}]|{leader_id}|auc{auc:.3f}"
    tag_templates:
      - "backend:{backend}"
      - "leader_algo:{leader_algo_raw}"
