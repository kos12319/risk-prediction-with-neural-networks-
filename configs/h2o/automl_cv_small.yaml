extends: automl

data:
  csv_path: data/raw/samples/thesis_data_sample_1k.csv

split:
  method: time
  cv:
    enabled: true
    n_folds: 3
    initial_train_fraction: 0.5
    validation_fraction: 0.2
    train_full_after: true

automl:
  max_runtime_secs: 40
  leaderboard_make_test: false
  leaderboard_curve_top_n: 3

tracking:
  backend: none
  wandb:
    enabled: false
