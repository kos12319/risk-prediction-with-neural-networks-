extends: h2o/base

data:
  csv_path: data/raw/samples/thesis_data_sample_10k.csv

# Backend is implied by the H2O CLI; `model.backend` optional

automl:
  progress: false
  log_level: WARN
  suppress_dependency_warnings: true
  max_runtime_secs: 60
  max_models: null
  balance_classes: true
  max_after_balance_size: 5.0
  seed: 42
  stopping_metric: AUC
  sort_metric: AUCPR
  include_algos: []
  exclude_algos: []
  nfolds: 0
  nthreads: -1
  max_mem_size: null
  export_checkpoints_dir: null
  log_dir: null
  leaderboard_extra_columns: ALL
  leaderboard_make_test: true
  explanation_plots:
    model_correlation: true
    varimp_heatmap: true
    varimp_top_k: 20
    varimp_winners_top_k: 35
    varimp_winners_sort: mean
    varimp_heatmap_row_height: 0.35
    varimp_heatmap_fontsize: 9
    per_family_varimp:
      enabled: true
      top_k: 20
    partial_dependence:
      enabled: true
      top_k: 3
      nbins: 20
      data: train
      ice: false

output:
  model_filename: loan_default_model.zip

tracking:
  backend: wandb
  wandb:
    enabled: true
    mode: online
    run_name_template: "{dataset}|{split}|{pos}|h2o[{leader_algo}]|{leader_id}|nc{nc}|auc{auc:.3f}"
    tag_templates:
      - "backend:{backend}"
      - "leader_algo:{leader_algo_raw}"
