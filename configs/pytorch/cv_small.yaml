extends: ../default

data:
  csv_path: data/raw/samples/thesis_data_sample_1k.csv

split:
  method: time
  cv:
    enabled: true
    n_folds: 3
    initial_train_fraction: 0.5
    validation_fraction: 0.2
    train_full_after: true

model:
  layers: [128, 64]
  dropout: [0.3, 0.2]
  epochs: 5
  batch_size: 64
  early_stopping_patience: 2

tracking:
  backend: none
  wandb:
    enabled: false
