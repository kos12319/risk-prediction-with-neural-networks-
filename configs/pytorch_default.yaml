extends: pytorch/base

model:
  backend: pytorch
  architecture: mlp
  layers: [256, 128, 64, 32]
  dropout: [0.4, 0.3, 0.2, 0.2]
  batchnorm: true
  loss: binary_crossentropy
  focal:
    enabled: false
    alpha: 0.25
    gamma: 2.0
  optimizer: adam
  epochs: 30
  batch_size: 128
  val_split: 0.2
  early_stopping_patience: 10

output:
  model_filename: loan_default_model.pt

training:
  class_weight: null

tracking:
  backend: wandb
  wandb:
    enabled: true
    project: loan-risk-mlp
