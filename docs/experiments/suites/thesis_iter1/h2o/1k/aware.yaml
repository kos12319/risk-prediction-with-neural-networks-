extends: ../../../../../../configs/h2o/automl

data:
  csv_path: data/raw/samples/thesis_data_sample_1k.csv
  features:
    # Provider-aware feature set (adds pricing/scoring)
    - loan_amnt
    - term
    - purpose
    - emp_length
    - annual_inc
    - verification_status
    - home_ownership
    - addr_state

    # Lender pricing/scoring
    - int_rate
    - grade
    - sub_grade
    - installment

    # Credit profile
    - dti
    - delinq_2yrs
    - pub_rec
    - inq_last_6mths
    - open_acc
    - total_acc
    - revol_bal
    - revol_util
    - fico_range_low
    - fico_range_high
    - mort_acc

    # Depth/limits and risk indicators
    - total_rev_hi_lim
    - bc_open_to_buy
    - bc_util
    - percent_bc_gt_75
    - tot_cur_bal
    - tot_hi_cred_lim
    - total_bal_ex_mort
    - total_bc_limit
    - total_il_high_credit_limit
    - num_rev_accts
    - num_rev_tl_bal_gt_0
    - num_il_tl
    - num_bc_tl
    - num_bc_sats
    - num_actv_rev_tl
    - num_tl_90g_dpd_24m
    - pub_rec_bankruptcies
    - tax_liens

    # Dates for engineering/splitting (not fed)
    - issue_d
    - earliest_cr_line

automl:
  max_runtime_secs: 600
  leaderboard_extra_columns: ALL
  leaderboard_make_test: true
  leaderboard_curve_top_n: 5
