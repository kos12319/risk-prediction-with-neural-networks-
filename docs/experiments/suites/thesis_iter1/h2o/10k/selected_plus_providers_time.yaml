extends: ../../../../../../configs/default_automl

data:
  # automl default points to 10k sample
  # Selected features — L1 best batch + provider pricing/scoring
  features:
    - addr_state
    - term
    - home_ownership
    - emp_length
    - verification_status
    - dti
    - purpose
    - inq_last_6mths
    - loan_amnt
    - fico_range_high
    - fico_range_low
    - revol_bal
    - int_rate
