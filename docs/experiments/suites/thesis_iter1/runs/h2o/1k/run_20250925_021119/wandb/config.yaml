eval:
    value:
        pos_label: 0
        threshold:
            strategy: youden_j
            value: 0.5
model:
    value:
        architecture: mlp
        backend: h2o
        batch_size: 128
        batchnorm: true
        dropout:
            - 0.4
            - 0.3
            - 0.2
            - 0.2
        early_stopping_patience: 10
        epochs: 30
        focal:
            alpha: 0.25
            enabled: false
            gamma: 2
        layers:
            - 256
            - 128
            - 64
            - 32
        loss: binary_crossentropy
        optimizer: adam
        val_split: 0.2
output:
    value:
        model_filename: loan_default_model.pt
        runs_root: local_runs
oversampling:
    value:
        enabled: false
        method: random_over_sampler
preprocessing:
    value:
        categorical:
            encoder_params:
                handle_unknown: ignore
            imputer: most_frequent
        categorical_encoder: one_hot
        numerical:
            imputer: median
            scaler: standard
        sparse_threshold: 0.3
split:
    value:
        cv:
            enabled: false
            gap: 0
            initial_train_fraction: 0.4
            mode: expanding
            n_folds: 0
            shuffle_within_folds: false
            train_full_after: false
            validation_fraction: 0.2
        method: time
        random_state: 42
        test_size: 0.2
        time_col: issue_d
tracking:
    value:
        backend: wandb
        wandb:
            enabled: true
            entity: null
            group: null
            group_template: '{dataset}|{split}|{pos}|{backend}'
            ignore_globs:
                - '**/*.csv'
