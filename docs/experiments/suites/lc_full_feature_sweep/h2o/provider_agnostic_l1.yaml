extends: ./common

data:
  features:
    - addr_state
    - term
    - home_ownership
    - emp_length
    - verification_status
    - dti
    - purpose
    - inq_last_6mths
    - loan_amnt
    - fico_range_high
    - fico_range_low
    - revol_bal
  winsorize:
    loan_amnt:
      lower_quantile: 0.01
      upper_quantile: 0.995
    dti:
      lower_value: 0.0
      upper_quantile: 0.995
    revol_bal:
      lower_value: 0.0
      upper_quantile: 0.995
    fico_range_high:
      lower_quantile: 0.005
      upper_quantile: 0.995
    fico_range_low:
      lower_quantile: 0.005
      upper_quantile: 0.995
    fico_spread:
      lower_value: 0.0
      upper_quantile: 0.99
